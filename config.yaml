# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: privacy-pools
description: Privacy Pools multi-chain indexer (Ethereum + Optimism + BSC + Arbitrum)

storage:
  postgres:
    default: true
  clickhouse: true

field_selection:
  transaction_fields:
    - hash
    - from

contracts:
  - name: Entrypoint
    handler: src/EventHandlers.ts
    events:
      - event: PoolRegistered(address _pool, address _asset, uint256 _scope)
      - event: PoolRemoved(address _pool, address _asset, uint256 _scope)
      - event: PoolConfigurationUpdated(address _pool, address _asset, uint256 _newMinimumDepositAmount, uint256 _newVettingFeeBPS, uint256 _newMaxRelayFeeBPS)
      - event: PoolWindDown(address _pool)
      - event: RootUpdated(uint256 _root, string _ipfsCID, uint256 _timestamp)
      - event: Deposited(address indexed _depositor, address indexed _pool, uint256 _commitment, uint256 _amount)
      - event: WithdrawalRelayed(address indexed _relayer, address indexed _recipient, address indexed _asset, uint256 _amount, uint256 _feeAmount)
      - event: FeesWithdrawn(address _asset, address _recipient, uint256 _amount)

  - name: PrivacyPool
    handler: src/EventHandlers.ts
    events:
      - event: Deposited(address indexed _depositor, uint256 _commitment, uint256 _label, uint256 _value, uint256 _precommitmentHash)
      - event: Withdrawn(address indexed _processooor, uint256 _value, uint256 _spentNullifier, uint256 _newCommitment)
      - event: Ragequit(address indexed _ragequitter, uint256 _commitment, uint256 _label, uint256 _value)
      - event: LeafInserted(uint256 _index, uint256 _leaf, uint256 _root)
      - event: PoolDied()

  # Thin Uniswap V4 price source on BSC. We only need the *current*
  # price per token, so we don't backfill history — the per-contract
  # start_block below kicks in well after the V4 deploy. Pool metadata
  # is hard-coded in src/v4PoolMeta.ts (snapshot of discovered pools)
  # so we don't even need an Initialize handler.
  - name: UniswapV4PoolManager
    handler: src/EventHandlers.ts
    events:
      - event: Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee)

